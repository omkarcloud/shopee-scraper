sebelumnya.","label_lowest_price_guaranteed_tnc__MY":"Click on the link above to find out more","label_lowest_price_guaranteed_tnc__PH":"What is the Lowest Price Guarantee?\n\n If you find the same product at a lower price from our list of approved competitors, Shopee will give you 1.2x the value of the price difference in Shopee coins. Simply tap on “Claim for Shopee coins!” and follow the steps in our chat to submit your claim.\n\n For more details, please refer to our terms and conditions or visit our Shopee_Official_LPG account and chat to us!\n\n Terms & Conditions apply.\n\n","label_lowest_price_guaranteed_tnc__PL":"Jak działa gwarancja najniższej ceny?\n\n1. Produkty biorące udział w programie są oznaczone specjalną ikoną “Gwarancja najniższej ceny”\n2. Tańszy produkt musi zostać zgłoszony w ciągu 3 dni od dokonania zakupów na Shopee w specjalnym formularzu w aplikacji mobilnej\n3. W przypadku pozytywnie rozpatrzonego zgłoszenia możesz zyskać do 200% różnicy ceny w Shopee Coins","label_lowest_price_guaranteed_tnc__SG":"What is the Lowest Price Guarantee?\n\n   If you find the same product at a lower price from our list of approved competitors, Shopee will issue you with a voucher reward worth 2x of the difference in price. Simply tap on “Claim for a FREE voucher/coins!” and follow the steps in our chat to submit your claim.\n\n    For more details, please refer to our terms and conditions or visit our Shopee_Official_LPG account and chat to us!\n\n   Terms & Conditions apply.\n\n","label_lowest_price_guaranteed_tnc__TH":"Shopee Took Sure: What is it?\n\nIf you purchase a product with \"Shopee Took Sure\" badge on Shopee (Thailand) application or website and find the same product offered at a lower price on other e-commerce platforms established in Thailand within 7 days from the date of the completed payment for your order on Shopee, Shopee gladly refund the price difference in the form of Shopee Coins, up to a maximum of 300 coins per month (limited to a maximum of 1 claim request per person, per month, per device, per account). These Shopee Coins will be automatically credited into your user account within 14 working days once your claim request meets the specified conditions and has been verified and approved by Shopee.\n\nTerms and Conditions of the \"Shopee Took Sure\" Campaign:\n\nPrice Comparison:\n1.1. The price difference will be calculated based on the net selling price before deducting any promotions of the specified product on other e-commerce platforms only. This means that discount codes, vouchers, additional promotions from credit cards, or cashback from other companies or entities related to those companies will not be considered when calculating the price difference.\n1.2. All reference prices are in Thai Baht.\n1.3. E-commerce platform refers to the platform or online marketplace that acts as an intermediary for presenting and purchasing products between buyers and sellers. It allows buyers and sellers, who are users of the platform, to directly communicate and transact with each other.\n\nProducts:\n2.1. Only products with \"Shopee Took Sure\" badge shown on Shopee (Thailand) application or website are eligible for the price claim.\n2.2. The products which are eligible for price claim must be made of the same type, with identical characteristics, specifications, brand, color, condition, size, model and/or production year, and have the same warranty conditions as the products listed on other e-commerce platforms. This condition also applies to products bundled together with the main product (Product Bundles), where each item in the bundle must be the same.\n2.3. The products which are eligible for price claim must be available in stock and ready for online purchase through other e-commerce platforms in which the current price of such products must be listed at a price lower than the price offered on Shopee at the time Shopee verifies the price claim.\n2.4. The products which are eligible for price claim must have a minimum quantity sold of 1 unit on other e-commerce platforms at the time Shopee verifies the price claim.\n2.5. The products which are eligible for price claim must not be purchased directly from the manufacturer, exclusive distributors, or the brand owner itself, including, but not limited to  Apple.com, Store.sony.com.\n2.6. The products which are eligible for price claim must not be second-hand items, counterfeit products, illegal products, pre-order products, digital goods (e.g., digital gift cards, mobile top-up cards, internet package cards, movie tickets, entertainment, and bill payments), tickets and vouchers, refunded/returned products, products with canceled orders, or products that are defective or cannot be used.\n\nShopee Coins:\n3.1. The amount of Shopee Coins you can claim = difference of the product price (product price completely purchased and paid in full on Shopee - current product price offered on other e-commerce platforms*), excluding the shipping cost for the products.\n3.2. Product price completely purchased and paid in full on Shopee means the selling price of the product on Shopee before deducting any discounts, and when the buyer proceeds the order and completely pays in full.\n3.3. Current product price offered on other e-commerce platforms means the price of products offered for sale by other e-commerce platforms within 7 days from the successful payment date for the products purchased on Shopee.\n3.4. The maximum refund limit for Shopee Coins is 300 coins per transaction/person/month/device/account.\n3.5. You will receive Shopee Coins when your price claim submission is verified and approved. They can be used as discounts for all categories of products available for sale on Shopee application and website (except for infant formula categories 1 and 2, tickets and vouchers, gold bars, gold plates, and controlled goods). There is no minimum spend requirement for the aforementioned discounts, and the discounts must not exceed 25% of the total payment amount for each order.\n3.6. Shopee Coins have a validity period of 3 months from the date of receiving.\n3.7. The received Shopee Coins cannot be exchanged or converted into cash.\n3.8. Shopee Coins that have been received and used for purchasing products and making payments are not eligible to be refunded or compensated under any circumstances.\n3.9. Additional terms and details are subject to Terms and Conditions of Shopee Coins.\n\nPrice Difference Claim Report:\n4.1. Buyers must submit a price claim request within 7 days from the date of complete payment by clicking on the price claim button on the respective product page.\n4.2. Buyers must provide the following details and supporting evidence:\nShopee Order: Order ID for the price claim request.\nOther E-commerce Platform Order: Price report,  screenshots, and URL links of the e-commerce platforms offering the same product.\n4.3. Shopee will review the price claim request and notify the verification result through in-app notifications. If the request is approved, Shopee Coins will be automatically credited to your account within 14 business days from the approval date. If there are any price changes during the aforementioned 14 business days, they will not affect the originally submitted price.\n4.4. The maximum limit for price claim requests is 1 request per month per user per device per account (only applicable for verified and approved requests). Shopee will not consider any price variation requests that exceed the specified limit.\n4.5. Shopee reserves the right to reject price claim requests from buyers with abnormal account statuses or suspected fraudulent activities.\n4.6. Shopee reserves the right to reject price claim requests from sellers who report price differences arising out of its own stores.\n4.7. The price claim request is only applicable to the purchase order that pays one time off. In the event of installment payment, such purchase order is invalid to proceed claim under this campaign.\n4.8. Shopee employees, their families, or individuals/companies associated with Shopee's campaign are not eligible to participate in the campaign.\n4.9. Shopee will notify any changes to terms and conditions or the discontinuation of the activity at an appropriate time. In the event of disputes or conflicts, Shopee will consider the facts in conjunction with the terms and conditions of this campaign in a fair manner.\n4.10. For inquiries and further information, please contact Chat with Shopee (go to 'Me' page in the Shopee app > scroll down to the bottom > select 'Chat with Shopee') or visit https://help.shopee.co.th/th/s/\n\nActivity Period: June 26th - August 31st, 2023\n\nUpdated terms and conditions: June 26th, 2023","label_lowest_price_guaranteed_tnc__TW":"Lowest price guaranteed terms and conditions for TW","label_lowest_price_guaranteed_tnc__VN":"THỂ LỆ CHƯƠNG TRÌNH \"GIÁ CÔNG PHÁ! Ở ĐÂU RẺ HƠN, SHOPEE HOÀN TIỀN!\"\n\nGiới thiệu\nShopee cam kết đem đến cho bạn những sản phẩm với mức giá không đâu rẻ bằng. Nếu bạn tìm thấy sản phẩm có giá thấp hơn sản phẩm bạn đã mua trên Shopee, hãy thông báo, chúng tôi sẽ hoàn trả gấp đôi phần chênh lệch (có điều kiện áp dụng).\n\nPhạm vi áp dụng\n• Thời gian: từ ngày 8.8.2017 đến 31.8.2017\n• Sản phẩm được áp dụng: thuộc chương trình “Giá công phá – Ở đâu rẻ hơn, Shopee hoàn tiền”\n• Sản phẩm để so sánh: được bán trên các trang Thương mại điện tử lớn của Việt Nam. Vui lòng liên hệ Tổng đài CSKH 19001221 để biết chi tiết\n• Giá của sản phẩm để so sánh là giá niêm yết công khai để khách hàng mua được sản phẩm mới 100%, đầy đủ, nguyên vẹn, không bao gồm phí vận chuyển hay bất kì loại phí nào; không áp dụng mã giảm giá hay bất kì hình thức giảm giá/ chiết khấu nào khác\n\nCách thông báo cho Shopee\n• Gửi email tới GiaCongPha@shopee.vn với các thông tin sau:\n- Tên tài khoản và Mã đơn hàng bạn đã mua điện thoại trên Shopee\n- Đường dẫn (link) của sản phẩm bạn muốn thông báo có giá thấp hơn\n\nĐiều kiện để được hoàn tiền\n• Bạn đã đặt mua và nhận được sản phẩm thuộc chương trình “Giá công phá – Ở đâu rẻ hơn, Shopee hoàn tiền” trên Shopee và không có khiếu nại hay yêu cầu đổi/ trả\n• Bạn thông báo cho Shopee trong 07 ngày kể từ khi nhận hàng và chưa từng thông báo về sản phẩm trên Shopee trước đó\n• Đường dẫn (link) sản phẩm trên các trang thương mại điện tử khác mà bạn thông báo vẫn còn tồn tại trong 24h kể từ thời điểm bạn gửi email đến Shopee\n• Sản phẩm mà bạn thông báo là hàng mới 100%, được phân phối chính hãng tại thị trường Việt Nam, có giá thấp hơn và hoàn toàn trùng khớp về chủng loại, mẫu mã và cấu hình với chiếc điện thoại mà bạn đã mua trên Shopee\n\nCách thức Shopee hoàn tiền\n• Quy trình: Sau khi bạn thông báo, Shopee sẽ xác minh sản phẩm. Nếu đạt điều kiện hoàn tiền nêu trên, Shopee sẽ gửi Voucher (mã giảm giá) tương đương với giá trị 2 lần phần chênh lệch từ các kênh thương mại điện tử khác tới bạn qua thông báo trên ứng dụng Shopee. Mã có giá trị sử dụng trong vòng 30 ngày kể từ ngày Shopee thông báo.\n• Thời gian gửi Voucher: trong vòng 20 ngày kể từ ngày bạn thông báo\n\nLưu ý\n• Shopee có quyền từ chối hoàn tiền nếu phát hiện khách hàng không trung thực và lợi dụng chính sách của Shopee để trục lợi\n• Nhân viên/ Người nhà của người bán không được tham gia chương trình này\n• Chương trình có thể kết thúc sớm hơn dự kiến\n• Trong mọi trường hợp, quyết định của Shopee là quyết định cuối cùng","label_lowest_price_guaranteed_tnc_ID":"Syarat & Ketentuan Program Murah Lebay:\n\n1. Produk Murah Lebay adalah produk dengan harga termurah berdasarkan perbandingan harga untuk produk yang sama di Shopee.\n2. Voucher dari Murah Lebay hanya berlaku untuk produk yang terdaftar dalam koleksi Murah Lebay (tidak berlaku untuk Kategori Voucher dan sub-kategori Logam Mulia, Kartu Perdana, dan e-money) di Shopee.\n3. Stok produk harus tersedia di Shopee.\n4. Voucher dapat diklaim sebelum membeli produk.\n5. Shopee berhak mencabut label \"Murah Lebay\" sesuai dengan kepu ommerce platforms within 7 days from the successful payment date for the products purchased on Shopee.\n3.4. The maximum refund limit for Shopee Coins is 300 coins per transaction/person/month/device/account.\n3.5. You will receive Shopee Coins when your price claim submission is verified and approved. They can be used as discounts for all categories of products available for sale on Shopee application and website (except for infant formula categories 1 and 2, tickets and vouchers, gold bars, gold plates, and controlled goods). There is no minimum spend requirement for the aforementioned discounts, and the discounts must not exceed 25% of the total payment amount for each order.\n3.6. Shopee Coins have a validity period of 3 months from the date of receiving.\n3.7. The received Shopee Coins cannot be exchanged or converted into cash.\n3.8. Shopee Coins that have been received and used for purchasing products and making payments are not eligible to be refunded or compensated under any circumstances.\n3.9. Additional terms and details are subject to Terms and Conditions of Shopee Coins.\n\nPrice Difference Claim Report:\n4.1. Buyers must submit a price claim request within 7 days from the date of complete payment by clicking on the price claim button on the respective product page.\n4.2. Buyers must provide the following details and supporting evidence:\nShopee Order: Order ID for the price claim request.\nOther E-commerce Platform Order: Price report,  screenshots, and URL links of the e-commerce platforms offering the same product.\n4.3. Shopee will review the price claim request and notify the verification result through in-app notifications. If the request is approved, Shopee Coins will be automatically credited to your account within 14 business days from the approval date. If there are any price changes during the aforementioned 14 business days, they will not affect the originally submitted price.\n4.4. The maximum limit for price claim requests is 1 request per month per user per device per account (only applicable for verified and approved requests). Shopee will not consider any price variation requests that exceed the specified limit.\n4.5. Shopee reserves the right to reject price claim requests from buyers with abnormal account statuses or suspected fraudulent activities.\n4.6. Shopee reserves the right to reject price claim requests from sellers who report price differences arising out of its own stores.\n4.7. The price claim request is only applicable to the purchase order that pays one time off. In the event of installment payment, such purchase order is invalid to proceed claim under this campaign.\n4.8. Shopee employees, their families, or individuals/companies associated with Shopee's campaign are not eligible to participate in the campaign.\n4.9. Shopee will notify any changes to terms and conditions or the discontinuation of the activity at an appropriate time. In the event of disputes or conflicts, Shopee will consider the facts in conjunction with the terms and conditions of this campaign in a fair manner.\n4.10. For inquiries and further information, please contact Chat with Shopee (go to 'Me' page in the Shopee app > scroll down to the bottom > select 'Chat with Shopee') or visit https://help.shopee.co.th/th/s/\n\nActivity Period: June 26th - August 31st, 2023\n\nUpdated terms and conditions: June 26th, 2023","label_lowest_price_guaranteed_tnc_TW":"Lowest price guaranteed terms and conditions for TW","label_lowest_price_guaranteed_tnc_VN":"THỂ LỆ CHƯƠNG TRÌNH \"GIÁ CÔNG PHÁ! Ở ĐÂU RẺ HƠN, SHOPEE HOÀN TIỀN!\"\n\nGiới thiệu\nShopee cam kết đem đến cho bạn những sản phẩm với mức giá không đâu rẻ bằng. Nếu bạn tìm thấy sản phẩm có giá thấp hơn sản phẩm bạn đã mua trên Shopee, hãy thông báo, chúng tôi sẽ hoàn trả gấp đôi phần chênh lệch (có điều kiện áp dụng).\n\nPhạm vi áp dụng\n• Thời gian: từ ngày 8.8.2017 đến 31.8.2017\n• Sản phẩm được áp dụng: thuộc chương trình “Giá công phá – Ở đâu rẻ hơn, Shopee hoàn t
