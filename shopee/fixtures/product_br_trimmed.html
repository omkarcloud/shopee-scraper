ktu-waktu tanpa pemberitahuan sebelumnya.","label_lowest_price_guaranteed_tnc__MY":"Termos & condições:  \n\n1. O que é a Garantia de Preço Menor? Se você comprou um item com a tag \"Garantia de Preço Menor\" na Shopee e encontrou uma oferta mais barata no site do nosso concorrente, a Shopee reembolsará 120% da diferença de preço na forma de Moedas da Shopee. \n\n2. A Garantia de Preço Menor se aplica apenas a itens com a tag \"Garantia de Preço Menor\". \n\n3. Os sites dos concorrentes incluem apenas: www.lazada.com.my \n\n4. A diferença de preço exclui promoções especiais, como Vouchers / Cupons, Cashback ou Promoções de Cartão de Crédito, etc., dos concorrentes. \n\n5. A comparação da diferença de preço inclui taxa de frete, ou seja, 'Preço da Shopee x número de unidades + taxa de frete paga na Shopee' VS 'Preço do concorrente x número de unidades + taxa de frete do concorrente'. A compensação total por uma reivindicação com sucesso será de 120% da diferença de preço calculada acima. \n\n6. O produto relatado deve ser do mesmo tipo, descrição / especificação, marca, cor, condição, garantia, cor, ano do modelo e / ou tamanho e termos de garantia da oferta do concorrente. Isso inclui pacotes de produtos, em que todos os itens do pacote que estão sendo comparados devem corresponder exatamente. \n\n7. O produto não pode ser usado, pré-aprovado ou falsificado. \n\n8. O produto relatado deve estar em estoque no site do concorrente (ou seja, não esgotado) e permanecer disponível para compra online a um preço menor no momento em que realizamos nossa verificação de preços. \n\n9. As reivindicações de relatório de preços são válidas apenas para pedidos com pagamento concluído e devem ser enviadas dentro de três dias após o término do pagamento. \n\n10. O Relatório de preços deve ser acompanhado de uma captura de tela da oferta do concorrente \n\n11. A Shopee revisará o Relatório de Preços e reverterá via notificação por push com uma decisão dentro de 7 dias úteis após o envio do Relatório de Preços. \n\n12. As Moedas da Shopee concedidas no caso de um Relatório de Preços bem-sucedido são aplicáveis ​​apenas a Vendedores Preferidos e Lojas Oficiais e são válidas por 90 dias a partir da data de emissão. \n\n13. Caso o pedido seja cancelado ou seja emitido um reembolso, as Moedas da Shopee concedidas serão consideradas inválidas. \n\n14. Cada usuário pode receber no máximo um valor de RM 1.000 em moedas da Shopee por mês no caso de Relatório de preços. \n\n15. A Shopee se reserva o direito de não divulgar os motivos dos Relatórios de Preços mailsucedidos e de rejeitar qualquer reclamação de usuários fraudulentos. \n\n16. Os termos e condições estão sujeitos a alterações sem aviso prévio. \n\n","label_lowest_price_guaranteed_tnc__PH":"O que é Garantia de Preço Menor?\n\n Se você encontrar o mesmo produto a um preço mais baixo da nossa lista de concorrentes aprovados, o Shopee fornecerá 1,2x o valor da diferença de preço na forma de moedas do Shopee. Basta clicar em \"Reivindicar Moedas da Shopee!\" E seguir os passos em nosso chat para enviar sua reivindicação.\n\n Para obter mais detalhes, consulte nossos termos e condições ou visite Shopee_Official_LPG e converse conosco!\n\n Termos & Condições aplicáveis.\n\n","label_lowest_price_guaranteed_tnc__PL":"Jak działa gwarancja najniższej ceny?\n\n1. Produkty biorące udział w programie są oznaczone specjalną ikoną “Gwarancja najniższej ceny”\n2. Tańszy produkt musi zostać zgłoszony w ciągu 3 dni od dokonania zakupów na Shopee w specjalnym formularzu w aplikacji mobilnej\n3. W przypadku pozytywnie rozpatrzonego zgłoszenia możesz zyskać do 200% różnicy ceny w Shopee Coins","label_lowest_price_guaranteed_tnc__SG":"O que é a Garantia de Preço Menor?\n\n Se você encontrar o mesmo produto a um preço mais baixo da nossa lista de concorrentes aprovados, o Shopee fornecerá uma recompensa em voucher de 2x da diferença de preço. Basta clicar em \"Ganhe voucher / moedas GRÁTIS!\" e siga os passos em nos ão total por uma reivindicação bem-sucedida será de 120% da diferença de preço calculada acima. Cada reivindicação é elegível apenas para a compensação máxima de 500THB.\n3.As moedas da Shopee recompensadas no caso de um relatório de preços bem-sucedido são aplicáveis a todos os produtos no site / aplicativo da Shopee, mas só podem ser resgatadas em até 50% do valor de cada pedido. As moedas da Shopee são válidas por 3 meses desde a data de emissão.\n4. As moedas da Shopee não podem ser trocadas nem levantadas. Não há gasto mínimo para o uso de Moedas da Shopee. OU Consulte as regras de uso de Moeda da Shopee na Central de Ajuda.\n\nRelatório de preços\n1. O Relatório de preços deve ser enviado via botão de reivindicação na página do produto dentro de 7 dias a partir da data indicada na captura de tela do produto relatado. Se a compra do produto foi concluída, o usuário deve enviar a captura de tela do pedido em até 7 dias após a hora de criação do pedido, com o pagamento concluído.\n2. O Relatório de preços deve ser acompanhado de uma captura de tela e URL da oferta do concorrente.\n3. A Shopee revisará o Relatório de Preços e emitirá Moedas da Shopee se o Relatório de Preços for aceito dentro de 5 dias úteis após o envio do Relatório de Preços. Quaisquer alterações no preço do produto durante esse período de 5 dias não afetarão o relatório de preço inicial e a compensação.\n4. Cada usuário pode enviar no máximo 1 reclamação de Relatório de preços por mês. Não serão aceitas reclamações adicionais após o terceiro envio na mesma semana.\n5. Qualquer disputa em relação a esta atividade deve ser resolvida e decidida pela Companhia. A decisão da empresa será considerada final.\n6. A Empresa reserva-se o direito de alterar os termos e condições sem aviso prévio.\n7. A Empresa reserva-se o direito de rejeitar qualquer relatório de preços elaborado pelo usuário cuja conta pertença ao status irregular e a Empresa possa reter o motivo da rejeição desse relatório de preço."," reserva-se o direito de alterar os termos e condições sem aviso prévio.\n7. A Empresa reserva-se o direito de rejeitar qualquer relatório de preços elaborado pelo usuário cuja conta pertença ao status irregular e a Empresa possa reter o motivo da rejeição desse relatório de preço.","label_lowest_price_guaranteed_tnc_TW":"Termos e condições garantidos com o menor preço para TW","label_lowest_price_guaranteed_tnc_VN":"GÌ CŨNG RẺ\n\t\nĐối tượng tham gia:\n+ Tất cả Người dùng Shopee\n\t\nNội dung chương trình:\n+ Chương trình mang đến cho Người mua Shopee những sản phẩm có giá tốt nhất so với các sản phẩm cùng loại được bán trên sàn Shopee. Sản phẩm tham gia chương trình sẽ được gắn nhãn \"\"Gì Cũng Rẻ\"\" trên trang mua hàng của Shopee.\n+Shopee sẽ lựa chọn những sản phẩm tham gia đáp ứng các tiêu chí:\n- Sản phẩm của Shop được cam kết có giá cạnh tranh hơn so với các Shop khác trên sàn Shopee.\n- Sản phẩm nằm trong top bán chạy nhất Shopee\n- Shop có đánh giá tốt, có tỉ lệ hủy đơn và tỉ lệ giao hàng trễ thấp\n- Shop không có dấu hiệu vi phạm các Tiêu chuẩn cộng đồng hoặc Chính sách của Shopee, hoặc không thỏa mãn đủ các điều kiện yêu cầu khác của chương trình\n\nPhạm vi áp dụng:\n- Chỉ áp dụng cho các sản phẩm cùng loại được bán trên sàn Shopee\n- Giá của sản phẩm là giá niêm yết công khai để khách hàng mua được sản phẩm mới 100%, đầy đủ, nguyên vẹn và không bao gồm phí vận chuyển hay bất kỳ loại phí nào; không áp dụng mã giảm giá hay bất kỳ hình thức giảm giá/chiết khấu nào khác.\n\nQuy định chung:\n- Chương trình \"\"Gì cũng rẻ\"\" là chương trình riêng biệt với \"\"Rẻ vô địch - Ở đâu rẻ hơn, Shopee hoàn tiền\"\". Từ ngày 15/04/2021, Shopee sẽ dừng chương trình \"\"Rẻ vô địch\"\" vô thời hạn.\n- Chương trình chỉ áp dụng cho một số Người bán nhất định được chọn lọc theo tiêu chí của Shopee\n- Shopee sẽ là người quyết định cuối cùng về việc sản phẩm nào được tham gia Gì Cũng Rẻ.\n- Điều kiện và điều khoản chương trình có thể được thay đổi mà không cần thông báo trước.
