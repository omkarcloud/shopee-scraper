Harga Termurah\" Shopee. 3. Produk dalam koleksi \"Garansi Harga Temurah\" Shopee harus sama persis dengan produk yang terdaftar di platform lain, termasuk spesifikasi, warna, ukuran, kondisi (dalam box, tersegel dan bukan refurbish), bundling, tipe garansi dan variasi lainnya. 4. Stok produk harus tersedia di platform lain saat klaim dilakukan. 5. Harga produk di platform lain bukan merupakan harga grosir, harga yang terpotong diskon voucher, cashback, promosi kartu kredit, harga yang sudah termasuk ongkos kirim, harga error atau kesalahan ketik. 6. Produk di: a. Bukalapak harus dijual oleh penjual yang telah aktif berjualan setidaknya selama 3 bulan terakhir dengan produk klaim yang sudah diberi penilaian minimal 2 kali. b. Lazada harus dijual oleh penjual yang telah aktif berjualan setidaknya selama 3 bulan terakhir dengan produk klaim yang sudah diberi penilaian minimal 2 kali. c. Tokopedia harus dijual oleh penjual yang telah aktif berjualan setidaknya selama 3 bulan terakhir dengan produk klaim yang sudah diberi penilaian minimal 2 kali. 7. Klaim dapat diajukan sebelum produk dibeli atau dalam 3 hari setelah pembayaran terverifikasi oleh Shopee. 8. Klaim sebelum pembelian: Penggantian dalam bentuk voucher yang hanya bisa digunakan oleh pengguna terkait untuk produk yang diklaim, dengan nilai 2X perbedaan harga (voucher berlaku selama 3 hari). 9. Klaim setelah pembelian: Penggantian dalam bentuk voucher yang hanya bisa digunakan oleh pengguna terkait untuk seluruh produk di Shopee, dengan nilai 2X perbedaan harga (voucher berlaku selama 3 hari). 10. Perbedaan harga yang dapat diklaim tidak melebihi Rp1.000.000 atau 50% dari harga platform lain. Shopee akan mengganti perbedaan harga dan memilih berdasarkan nilai yang lebih rendah. 11. Batas maksimum klaim per pengguna adalah sebanyak 3 klaim yang berhasil per hari. Jam Operasional Klaim: pk 07.00 - 00.00 WIB","label_lowest_price_guaranteed_tnc__MY":"Terms & Conditions: \n\n1. What is Lowest Price Guaranteed? If you have purchased an item with the “Lowest Price Guaranteed” tag on Shopee and found a cheaper deal on our competitor’s website, Shopee will refund 120% of the price difference in the form of Shopee Coins.\n\n2. Lowest Price Guaranteed only applies to items with the “Lowest Price Guaranteed” tag. \n\n3. Competitor websites include only: www.lazada.com.my \n\n4. Price difference excludes special promotions such as Vouchers/ Coupons, Cashbacks or Credit Card Promos, etc., from competitors. \n\n5. Price difference comparison includes shipping fee, i.e., 'Shopee price x number of units + shipping fee paid on Shopee' VS 'Competitor price x number of units + shipping fee on competitor'. Total compensation for a successful claim will be 120% of the price difference calculated above. \n\n6. Product being reported must be of the same type, description/ specification, brand, colour, condition, warranty, colour, model year and/or size and warranty terms as that of the competitor’s deal. This includes product bundles, where all the items in the bundle being compared must be an exact match. \n\n7. Product cannot be used, preloved or counterfeit. \n\n8. The product reported on the competitor’s website must still be in stock (i.e. not sold out) and remain available for purchase online at the lower price at the time we conduct our price check. \n\n9. Price Report claims are only valid for orders with payment completed, and must be submitted within 3 days of payment completion time. \n\n10. Price Report must be accompanied with a screenshot of the competitor’s deal \n\n11. Shopee will review the Price Report and revert via push notification with a decision within 7 working days of submission of the Price Report. \n\n12. The Shopee Coins awarded in the event of a successful Price Report is applicable to only Preferred Sellers and Official Shops and is valid for 90 days from the time of issue. \n\n13. In the event that the order is cancelled or a refund issued, the Shopee Coins awarded will be deemed void. \n\n14. Each user can only receive a maximum of RM 1,000 worth of Shopee Coins per month from the Price Report. \n\n15. Shopee reserves the right not to disclose the reasons for unsuccessful Price Reports, and to reject any claims from fraudulent users. \n\n16. Terms and conditions are subject to change without prior notice. \n\n","label_lowest_price_guaranteed_tnc__PH":"What is the Lowest Price Guarantee?\n\n If you find the same product at a lower price from our list of approved competitors, Shopee will give you 1.2x the value of the price difference in Shopee coins. Simply tap on “Claim for Shopee coins!” and follow the steps in our chat to submit your claim.\n\n For more details, please refer to our terms and conditions or visit our Shopee_Official_LPG account and chat to us!\n\n Terms & Conditions apply.\n\n","label_lowest_price_guaranteed_tnc__PL":"Jak działa gwarancja najniższej ceny?\n\n1. Produkty biorące udział w programie są oznaczone specjalną ikoną “Gwarancja najniższej ceny”\n2. Tańszy produkt musi zostać zgłoszony w ciągu 3 dni od dokonania zakupów na Shopee w specjalnym formularzu w aplikacji mobilnej\n3. W przypadku pozytywnie rozpatrzonego zgłoszenia możesz zyskać do 200% różnicy ceny w Shopee Coins","label_lowest_price_guaranteed_tnc__SG":"What is the Lowest Price Guarantee?\n\n   If you find the same product at a lower price from our list of approved competitors, Shopee will issue you with a voucher reward worth 2x of the difference in price. Simply tap on “Claim for a FREE voucher/coins!” and follow the steps in our chat to submit your claim.\n\n    For more details, please refer to our terms and conditions or visit our Shopee_Official_LPG account and chat to us!\n\n   Terms & Conditions apply.\n\n","label_lowest_price_guaranteed_tnc__TH":"ช้อปปี้ถูกชัวร์ คืออะไร?\n\nหากคุณซื้อสินค้าที่มีเครื่องหมาย ช้อปปี้ถูกชัวร์ บนแอปพลิเคชันหรือเว็บไซต์ Shopee แล้วพบสินค้าของอีคอมเมิร์ซแพลตฟอร์มอื่นที่จัดตั้งขึ้นในประเทศไทยเสนอราคาสินค้าดังกล่าวในราคาที่ถูกกว่า ภายในระยะเวลา 7 วันนับจากวันที่คำสั่งซื้อมีการชำระเงินสมบูรณ์ Shopee ยินดีคืนส่วนต่างเป็น Shopee Coins สูงสุด 1,000 coins ต่อเดือน (จำกัดการแจ้งราคาสูงสุด 1 ครั้ง/คน/เดือน/เครื่อง/บัญชีใช้งาน) ซึ่งจะถูกเติมเข้าในบัญชีผู้ใช้ของคุณอัตโนมัติภายใน 14 วันทำการ เมื่อการแจ้งราคาของคุณเป็นไปตามเงื่อนไขที่กำหนดและผ่านการตรวจสอบและอนุมัติโดย Shopee แล้ว\nข้อกำหนดและเงื่อนไขของแคมเปญ “ช้อปปี้ถูกชัวร์”\n\nการเปรียบเทียบราคา\n1.1. ส่วนต่างของราคาจะคำนวณจากราคาขายสุทธิก่อนหักส่วนลดจากโปรโมชั่นของสินค้าที่ระบุไว้ในอีคอมเมิร์ซแพลตฟอร์มอื่นเท่านั้น กล่าวคือ โค้ดหรือคูปองส่วนลด, โปรโมชั่นเสริมจากบัตรเครดิต หรือ Cashback ของบริษัทอื่นๆ หรือผู้เกี่ยวข้องกับบริษัทดังกล่าว จะไม่ถูกนำไปคำนวณในส่วนต่างของราคา\n1.2. ราคาที่ใช้อ้างอิงทั้งหมดเป็นเงินสกุลบาทเท่านั้น\n1.3. อีคอมเมิร์ซแพลตฟอร์ม หมายถึง แพลตฟอร์ม (platform) หรือตลาดสินค้าออนไลน์ (e-marketplace) ที่เป็นสื่อกลางในการนำเสนอและการซื้อขายสินค้าระหว่างผู้ซื้อกับผู้ขาย โดยเปิดโอกาสให้ผู้ซื้อและผู้ขายสินค้าซึ่งเป็นผู้ใช้บริการแพลตฟอร์ม สามารถติดต่อซื้อขายสินค้ากันได้ผ่านทางแพลตฟอร์มได้โดยตรง\n\nสินค้า\n2.1. รับประกันเฉพาะสินค้าที่มีเครื่องหมาย ช้อปปี้ถูกชัวร์ ที่ปรากฏในแอปพลิเคชั่นหรือเว็บไซต์ Shopee เท่านั้น\n2.2. สินค้าที่แจ้งราคาต้องเป็นสินค้าประเภทเดียวกัน โดยมีลักษณะ รายละเอียด ยี่ห้อ สี สภาพ ขนาด และ/หรือ รุ่นปีที่ผลิตเท่ากัน และมีเงื่อนไขการรับประกันที่เหมือนกันกับสินค้าในอีคอมเมิร์ซแพลตฟอร์มอื่น เงื่อนไขนี้ให้รวมถึงสินค้าที่ควบรวมกับสินค้าหลัก (Product Bundles) โดยสินค้าแต่ละรายการในสินค้าควบรวมจะต้องเหมือนกันทุกรายการ\n2.3. สินค้าที่แจ้งราคาต้องเป็นสินค้าที่ยังคงอยู่ในสต็อก และพร้อมสำหรับการซื้อทางออนไลน์ผ่านอีคอมเมิร์ซแพลตฟอร์มอื่นในราคาที่ต่ำกว่าราคาที่เสนอขายบน Shopee ในขณะที่ Shopee ทำการตรวจสอบราคา\n2.4. สินค้าที่แจ้งราคาต้องเป็นสินค้าที่ระบุจำนวนที่ขายแล้วไม่ต่ำกว่า 1 ชิ้นบนอีคอมเมิร์ซแพลตฟอร์มอื่น ในขณะที่ Shopee ทำการตรวจสอบราคา\n2.5. สินค้าที่แจ้งราคาต้องไม่เป็นสินค้าที่ซื้อจากผู้ผลิต ผู้จัดจำหน่ายแต่เพียงผู้เดียว (exclusive distributor) หรือเจ้าของแบรนด์โดยตรง เช่น Apple.com, Store.sony.com ฯลฯ\n2.6. สินค้าที่แจ้งราคาต้องไม่เป็นสินค้ามือสอง สินค้าปลอม สินค้าผิดกฎหมาย สินค้าที่เปิดให้มีการจองสั่งซื้อล่วงหน้า (pre-order) สินค้าดิจิทัล (เช่น บัตรกำนัลดิจิทัล การเติมเงินโทรศัพท์เคลื่อนที่ แพคเกจอินเทอร์เน็ตบัตรเติมเงิน ตั๋วหนัง บันเทิง และการจ่ายบิลต่างๆ) สินค้าประเภทตั๋วและบัตรกำนัล สินค้าที่มีการคืนเงิน/คืนสินค้า สินค้าที่มีการยกเลิกคำสั่งซื้อ เสียหายหรือไม่สามารถใช้งานได้\n\nShopee Coins\n3.1. จำนวน Shopee Coins ที่ได้รับ = ส่วนต่างของราคาสินค้า (ราคา ณ วันที่ชำระเงินสำเร็จบน Shopee - ราคาปัจจุบันของอีคอมเมิร์ซแพลตฟอร์มอื่น*) โดยไม่รวมถึงค่าจัดส่งสินค้าดังกล่าว\n3.2. ราคา ณ วันที่ชำระเงินสำเร็จบน Shopee หมายถึง ราคาที่เสนอขายสินค้าบน Shopee ก่อนหักส่วนลดต่างๆ และผู้ซื้อทำการสั่งซื้อสินค้าและชำระเงินสำเร็จ\n3.3. ราคาปัจจุบันของอีคอมเมิร์ซแพลตฟอร์มอื่น หมายถึง ราคาของสินค้าที่เสนอขายโดยอีคอมเมิร์ซแพลตฟอร์มอื่นภายใน 7 วันนับจากวันที่คำสั่งซื้อบน Shopee มีการชำระเงินสมบูรณ์\n3.4. จำกัดการคืน Shopee Coins สูงสุด 1,000 coins/ครั้ง/คน/เดือน/เครื่อง/บัญชีใช้งาน\n3.5. คุณจะได้รับ Shopee Coins เมื่อการแจ้งราคาของคุณผ่านการตรวจสอบและอนุมัติแล้ว โดยสามารถใช้เป็นส่วนลดได้กับสินค้าทุกหมวดหมู่ในแอปพลิเคชั่นและเว็บไซต์ Shopee (ยกเว้นหมวดหมู่นมผงสำหรับเด็กสูตร 1 และ 2, สินค้าตั๋วและบัตรกำนัล, ทองคำแท่ง, ทองคำแผ่น และสินค้าควบคุมตามกฎหมาย) โดยไม่มีกำหนดขั้นต่ำ และส่วนลดดังกล่าวต้องมีมูลค่าไม่เกิน 25% ของยอดชำระเงินรวมในแต่ละคำสั่งซื้อ\n3.6. Shopee Coins มีอายุ 3 เดือน นับจากวันที่ได้รับ\n3.7. Shopee Coins ที่ได้รับ ไม่สามารถแลกเปลี่ยนหรือทอนเป็นเงินสดได้\n3.8. Shopee Coins ที่ได้รับและถูกนำไปใช้ในการซื้อสินค้าและชำระเงินแล้ว จะไม่สามารถคืนหรือชดเชยได้ภายหลังในทุกกรณี\n3.9. เงื่อนไขและรายละเอียดเพิ่มเติม อ้างอิงตามเงื่อนไขในการใช้ Shopee Coins\n\nการแจ้งส่วนต่างของราคา\n4.1. ผู้ซื้อต้องทำการแจ้งราคาภายใน 7 วันนับจากวันที่คำสั่งซื้อมีการชำระเงินสมบูรณ์ โดยคลิกที่ปุ่มการแจ้งราคาในหน้าเว็บไซต์ที่ระบุสินค้า\n4.2. ผู้ซื้อจะต้องแจ้งรายละเอียดและหลักฐานประกอบการพิจารณา ดังต่อไปนี้\nหมายเลขคำสั่งซื้อที่ต้องการแจ้งราคา\nรายงานราคาพร้อมกับภาพถ่ายหน้าจอและลิงก์ URL ของอีคอมเมิร์ซแพลตฟอร์มที่เสนอขายสินค้านั้นๆ\n4.3. Shopee จะทำการตรวจสอบการแจ้งราคา และแจ้งผลการอนุมัติผ่านการแจ้งเตือนในแอปพลิเคชั่น หากคำขอถูกอนุมัติ Shopee Coins จะถูกส่งเข้าในบัญชีของคุณอัตโนมัติภายใน 14 วันทำการหลังจากวันที่อนุมัติ หากสินค้ามีการเปลี่ยนแปลงราคาใดๆ ในระหว่าง 14 วันทำการดังกล่าว จะไม่มีผลกระทบต่อราคาที่ได้แจ้งไว้ครั้งแรก\n4.4. จำกัดการแจ้งราคาได้สูงสุด 1 ครั้ง/เดือน/คน/เครื่อง/บัญชีใช้งาน (เฉพาะกรณีที่การแจ้งราคาได้รับการตรวจสอบและอนุมัติแล้ว) Shopee จะไม่พิจารณาการแจ้งราคาใดๆ ที่มากกว่าจำนวนดังกล่าว\n4.5. Shopee ขอสงวนสิทธิ์ในการปฏิเสธคำขอแจ้งราคาจากผู้ซื้อที่มีสถานะบัญชีไม่ปกติหรือตรวจพบว่ามีการกระทำอันเป็นการฉ้อโกงหรือการกระทำที่ต้องสงสัย\n4.6. Shopee ขอสงวนสิทธิ์ในการปฏิเสธคำขอแจ้งราคาจากร้านค้าที่ทำการแจ้งสินค้าภายในร้านตนเอง\n4.7. ราคาที่ใช้อ้างอิงต้องเป็นราคาที่ชำระแบบปกติเท่านั้น สำหรับสินค้าราคาผ่อนชำระจะไม่ถือว่าอยู่ในเงื่อนไขของการแจ้งราคาสินค้า\n4.8. พนักงานของ Shopee ครอบครัวของพนักงาน หรือบุคคล/บริษัทที่มีส่วนเกี่ยวข้องกับ Shopee ในการการจัดแคมเปญครั้งนี้ ไม่มีสิทธิ์เข้าร่วมแคมเปญดังกล่าวทั้งสิ้น\n4.9. หากมีการเปลี่ยนแปลงข้อกำหนดและเงื่อนไขต่างๆ หรือมีการยุติกิจกรรม Shopee จะแจ้งให้ทราบตามเวลาที่สมควร กรณีที่มีข้อขัดแย้งหรือข้อพิพาท บริษัท ช้อปปี้ (ประเทศไทย) จำกัด (“Shopee”) จะพิจารณาจากข้อเท็จจริงประกอบกับข้อกำหนดและเงื่อนไขของแคมเปญนี้อย่างเป็นธรรม\n4.10. สอบถามข้อมูล และตรวจสอบเงื่อนไขเพิ่มเติมได้ที่ Chat with Shopee (ไปที่หน้า 'ฉัน' บนแอปพลิเคชัน Shopee > เลื่อนลงมาด้านล่างสุด เลือก 'Chat with Shopee') หรือ https://help.shopee.co.th/th/s/\n\nระยะเวลากิจกรรม: 1 ส.ค. - 31 ธ.ค. 2566\n\nอัพเดทเงื่อนไข 1 ส.ค. 2566","label_lowest_price_guaranteed_tnc__TW":"Lowest price guaranteed terms and conditions for TW","label_lowest_price_guaranteed_tnc__VN":"THỂ LỆ CHƯƠNG TRÌNH \"GIÁ CÔNG PHÁ! Ở ĐÂU RẺ HƠN, SHOPEE HOÀN TIỀN!\"\n\nGiới thiệu\nShopee cam kết đem đến cho bạn những sản phẩm với mức giá không đâu rẻ bằng. Nếu bạn tìm thấy sản phẩm có giá thấp hơn sản phẩm bạn đã mua trên Shopee, hãy thông báo, chúng tôi sẽ hoàn trả gấp đôi phần chênh lệch (có điều kiện áp dụng).\n\nPhạm vi áp dụng\n• Thời gian: từ ngày 8.8.2017 đến 31.8.2017\n• Sản phẩm được áp dụng: thuộc chương trình “Giá công phá – Ở đâu rẻ hơn, Shopee hoàn tiền”\n• Sản phẩm để so sánh: được bán trên các trang Thương mại điện tử lớn của Việt Nam. Vui lòng liên hệ Tổng đài CSKH 19001221 để biết chi tiết\n• Giá của sản phẩm để so sánh là giá niêm yết công khai để khách hàng mua được sản phẩm mới 100%, đầy đủ, nguyên vẹn, không bao gồm phí vận chuyển hay bất kì loại phí nào; không áp dụng mã giảm giá hay bất kì hình thức giảm giá/ chiết khấu nào khác\n\nCách thông báo cho Shopee\n• Gửi email tới GiaCongPha@shopee.vn với các thông tin sau:\n- Tên tài khoản và Mã đơn hàng bạn đã mua điện thoại trên Shopee\n- Đường dẫn (link) của sản phẩm bạn muốn thông báo có giá thấp hơn\n\nĐiều kiện để được hoàn tiền\n• Bạn đã đặt mua và nhận được sản phẩm thuộc chương trình “Giá công phá – Ở đâu rẻ hơn, Shopee hoàn tiền” trên Shopee và không có khiếu nại hay yêu cầu đổi/ trả\n• Bạn thông báo cho Shopee trong 07 ngày kể từ khi nhận hàng và chưa từng thông báo về sản phẩm trên Shopee trước đó\n• Đường dẫn (link) sản phẩm trên các trang thương mại điện tử khác mà bạn thông báo vẫn còn tồn tại trong 24h kể từ thời điểm bạn gửi email đến Shopee\n• Sản phẩm mà bạn thông báo là hàng mới 100%, được phân phối chính hãng tại thị trường Việt Nam, có giá thấp hơn và hoàn toàn trùng khớp về chủng loại, mẫu mã và cấu hình với chiếc điện thoại mà bạn đã mua trên Shopee\n\nCách thức Shopee hoàn tiền\n• Quy trình: Sau khi bạn thông báo, Shopee sẽ xác minh sản phẩm. Nếu đạt điều kiện hoàn tiền nêu trên, Shopee sẽ gửi Voucher (mã giảm giá) tương đương với giá trị 2 lần phần chênh lệch từ các kênh thương mại điện tử khác tới bạn qua thông báo trên ứng dụng Shopee. Mã có giá trị sử dụng trong vòng 30 ngày kể từ ngày Shopee thông báo.\n• Thời gian gửi Voucher: trong vòng 20 ngày kể từ ngày bạn thông báo\n\nLưu ý\n• Shopee có quyền từ chối hoàn tiền nếu phát hiện khách hàng không trung thực và lợi dụng chính sách của Shopee để trục lợi\n• Nhân viên/ Người nhà của người bán không được tham gia chương trình này\n• Chương trình có thể kết thúc sớm hơn dự kiến\n• Trong mọi trường hợp, quyết định của Shopee là quyết định cuối cùng","label_lowest_price_guaranteed_tnc_ID":"Berikut adalah Syarat & Ketentuan program 'Garansi Harga Termurah, Uang Kembali 2X Lipat': 1. Produk yang dibandingkan harus merupakan produk yang berada di platform online Lazada, Tokopedia dan Bukalapak. 2. Produk adalah barang baru (bukan bekas) dan merupakan produk dalam promosi \"Garansi Harga Termurah\" Shopee. 3. Produk dalam koleksi \"Garansi Harga Temurah\" Shopee harus sama persis dengan produk yang terdaftar di platform lain, termasuk spesifikasi, warna, ukuran, kondisi (dalam box, tersegel dan bukan refurbish), bundling, tipe garansi dan variasi lainnya. 4. Stok produk harus tersedia di platform lain saat klaim dilakukan. 5. Harga produk di platform lain bukan merupakan harga grosir, harga yang terpotong diskon voucher, cashback, promosi kartu kredit, harga yang sudah termasuk ongkos kirim, harga error atau kesalahan ketik. 6. Produk di: a. Bukalapak harus dijual oleh penjual yang telah aktif berjualan setidaknya selama 3 bulan terakhir dengan produk klaim yang sudah diberi penilaian minimal 2 kali. b. Lazada harus dijual oleh penjual yang telah aktif berjualan setidaknya selama 3 bulan terakhir dengan produk klaim yang sudah diberi penilaian minimal 2 kali. c. Tokopedia harus dijual oleh penjual yang telah aktif berjualan setidaknya selama 3 bulan terakhir dengan produk klaim yang sudah diberi penilaian minimal 2 kali. 7. Klaim dapat diajukan sebelum produk dibeli atau dalam 3 hari setelah pembayaran terverifikasi oleh Shopee. 8. Klaim sebelum pembelian: Penggantian dalam bentuk voucher yang hanya bisa digunakan oleh pengguna terkait untuk produk yang diklaim, dengan nilai 2X perbedaan harga (voucher berlaku selama 3 hari). 9. Klaim setelah pembelian: Penggantian dalam bentuk voucher yang hanya bisa digunakan oleh pengguna terkait untuk seluruh produk di Shopee, dengan nilai 2X perbedaan harga (voucher berlaku selama 3 hari). 10. Perbedaan harga yang dapat diklaim tidak melebihi Rp1.000.000 atau 50% dari harga platform lain. Shopee akan mengganti perbedaan harga dan memilih berdasarkan nilai yang lebih rendah. 11. Batas maksimum klaim per pengguna adalah sebanyak 3 klaim yang berhasil per hari. Jam Operasional Klaim: pk 07.00 - 00.00 WIB","label_lowest_price_guaranteed_tnc_MX":"¿Qué es la garantía de precio más bajo?\n \n  Si encuentras el mismo producto a un precio más bajo de nuestra lista de competidores aprobados, Shopee te entregará un cupón de recompensa por valor del doble de la diferencia de precio. Simplemente toca \"¡Reclama un cupón/monedas GRATIS!\" y sigue los pasos en nuestra charla para enviar la reclamación.\n \n  Para obtener más detalles, favor de consultar nuestros términos y condiciones o visita nuestra cuenta Shopee_Official_LPG y charla con nosotros.\n \n  Términos y condiciones aplicables.","label_lowest_price_guaranteed_tnc_MY":"Terms & Conditions: \n\n1. What is Lowest Price Guaranteed? If you have purchased an item with the “Lowest Price Guaranteed” tag on Shopee and found a cheaper deal on our competitor’s website, Shopee will refund 120% of the price difference in the form of Shopee Coins.\n\n2. Lowest Price Guaranteed only applies to items with the “Lowest Price Guaranteed” tag. \n\n3. Competitor websites include only: www.lazada.com.my \n\n4. Price difference excludes special promotions such as Vouchers/ Coupons, Cashbacks or Credit Card Promos, etc., from competitors. \n\n5. Price difference comparison includes shipping fee, i.e., 'Shopee price x number of units + shipping fee paid on Shopee' VS 'Competitor price x number of units + shipping fee on competitor'. Total compensation for a successful claim will be 120% of the price difference calculated above. \n\n6. Product being reported must be of the same type, description/ specification, brand, colour, condition, warranty, colour, model year and/or size and warranty terms as that of the competitor’s deal. This includes product bundles, where all the items in the bundle being compared must be an exact match. \n\n7. Product cannot be used, preloved or counterfeit. \n\n8. The product reported on the competitor’s website must still be in stock (i.e. not sold out) and remain available for purchase online at the lower price at the time we conduct our price check. \n\n9. Price Report claims are only valid for orders with payment completed, and must be submitted within 3 days of payment completion time. \n\n10. Price Report must be accompanied with a screenshot of the competitor’s deal \n\n11. Shopee will review the Price Report and revert via push notification with a decision within 7 working days of submission of the Price Report. \n\n12. The Shopee Coins awarded in the event of a successful Price Report is applicable to only Preferred Sellers and Official Shops and is valid for 90 days from the time of issue. \n\n13. In the event that the order is cancelled or a refund issued, the Shopee Coins awarded will be deemed void. \n\n14. Each user can only receive a maximum of RM 1,000 worth of Shopee Coins per month from the Price Report. \n\n15. Shopee reserves the right not to disclose the reasons for unsuccessful Price Reports, and to reject any claims from fraudulent users. \n\n16. Terms and conditions are subject to change without prior notice. \n\n","label_lowest_price_guaranteed_tnc_PH":"What is the Lowest Price Guarantee?\n\n If you find the same product at a lower price from our list of approved competitors, Shopee will give you 1.2x the value of the price difference in Shopee coins. Simply tap on “Claim for Shopee coins!” and follow the steps in our chat to submit your claim.\n\n For more details, please refer to our terms and conditions or visit our Shopee_Official_LPG account and chat to us!\n\n Terms & Conditions apply.\n\n","label_lowest_price_guaranteed_tnc_SG":"What is the Lowest Price Guarantee?\n\n   If you find the same product at a lower price from our list of approved competitors, Shopee will issue you with a voucher reward worth 2x of the difference in price. Simply tap on “Claim for a FREE voucher/coins!” and follow the steps in our chat to submit your claim.\n\n    For more details, please refer to our terms and conditions or visit our Shopee_Official_LPG account and chat to us!\n\n   Terms & Conditions apply.\n\n","label_lowest_price_guaranteed_tnc_TH":"เงื่อนไขและกติกาการแจ้งราคา: Shopee ถูกที่สุด การันตี ดีอย่างไร\n\nหากคุณซื้อสินค้าที่มีเครื่องหมาย \"SHOPEE ถูกที่สุด การันตี\" แล้วพบสินค้าของเว็บไซต์LAZADA* ที่ราคาถูกกว่า SHOPEE ยินดีคืนเป็น SHOPEE COINS ให้ 120% ของมูลค่าส่วนต่างราคา ซึ่งจะถูกเติมเข้าในบัญชีของคุณอัตโนมัติ เมื่อการแจ้งราคาของคุณได้รับการตรวจสอบและยอบรับแล้ว\n\nการเปรียบเทียบราคา\n1. ส่วนต่างของราคาจะคำนวณจากราคาขายสุทธิของสินค้าที่ระบุไว้ใน LAZADA.CO.TH เท่านั้น โค้ดหรือคูปองส่วนลด, โปรโมขั่นเสริมจากบัตรเครดิต หรือ CASHBACK ของบริษัทอื่นๆ หรือผู้เกี่ยวข้องกับบริษัทดังกล่าว จะไม่ถูกนำไปคำนวณในส่วนต่างของราคา\n2. ราคาที่ใช้อ้างอิงทั้งหมดเป็นเงินสกุลบาทเท่านั้น\n\nสินค้า\n1. รับประกันเฉพาะสินค้าที่มีเครื่องหมาย SHOPEE ถูกที่สุด การันตี (LOWEST PRICE GUARANTEE) ที่ปรากฎในแอปหรือเว็บไซต์ SHOPEE\n2. สินค้าที่แจ้งราคาต้องเป็นสินค้าประเภทเดียวกันโดยมีลักษณะ/รายละเอียด ยี่ห้อ สี สภาพ ขนาด และ/หรือรุ่นปีที่ผลิดเท่ากัน และมีเงื่อนไขการรับประกันที่เหมือนกันกับสินค้าในเว็บไซต์อื่น(เงื่อนไขนี้ให้รวมถึงสินค้าที่ควบรวมกับสินค้าหลัก (Product Bundles) โดยสินค้าแต่ละรายการในสินค้าควบรวมจะต้องเหมือนกันทุกรายการ)\n3. สินค้าที่แจ้งราคาต้องเป็นสินค้าที่ยังคงอยู่ในสต็อก และพร้อมสำหรับการซื้อทางออนไลน์ในราคาที่ต่ำกว่าในขณะที่บริษัทฯ ทำการตรวจสอบราคา\n4. สินค้าที่แจ้งราคาต้องไม่เป็นสินค้าที่ซื้อจากผู้ผลิตโดยตรง เช่น APPLE.COM, STORE.SONY.COM ฯลฯ\n5. สินค้าที่แจ้งราคาต้องไม่เป็นสินค้ามือสอง สินค้าปลอม สินค้าผิดกฎหมาย หรือไม่สามารถใช้งานได้\n\nSHOPEE COINS\n1. จำนวน SHOPEE COINS = ส่วนต่างของราคาสินค้า\n(ราคาปัจจุบันของ SHOPEE - ราคาปัจจุบันของเว็บไซต์อื่น ) x 120%\n2. จำกัดการคืน SHOPEE COINS สูงสุด 300 COINS/คน/ครั้ง/31วัน \n3. คุณจะได้รับ SHOPEE COINS เมื่อการแจ้งราคาของคุณผ่านการตรวจสอบและยอมรับแล้ว โดยสามารถใช้เป็นส่วนลดได้กับสินค้าทุกหมวดหมู่ในแอปและเว็บไซต์ของ SHOPEE (ยกเว้นหมวดหมู่ตั๋วและบัตรกำนัล และสินค้าควบคุมโดยไม่มีกำหนดขั้นต่ำ และส่วนลดดังกล่าวต้องมีมูลค่าไม่เกิน 50% ของยอดชำระเงินรวมในแต่ละคำสั่งซื้อ)\n4. SHOPEE COINS มีอายุ 3 เดือน นับจากวันที่ได้รับ\n5. SHOPEE COINS ที่ได้รับ ไม่สามารถแลกเปลี่ยนหรือทอนเป็นเงินสดได้\n6. SHOPEE COINS ที่ได้รับและถูกนำไปใช้ในการซื้อสินค้าและชำระเงินแล้ว จะไม่สามารถคืนหรือชดเชยได้ภายหลังในทุกกรณี\n7. เงื่อนไขและรายละเอียดเพิ่มเติม อ้างอิงตามเงื่อนไขในการใช้ SHOPEE COINS\n\nการแจ้งราคา\n1. ต้องทำการแจ้งราคาภายใน 7 วันก่อนการชำระ หรือ ภายใน 7 วันนับจากวันที่คำสั่งซื้อมีการชำระเงินสมบูรณ์ โดยคลิกที่ปุ่มการแจ้งราคา (CLIAM) ในหน้าเว็บไซต์ที่ระบุสินค้า\n2. ผู้ใช้บริการจะต้องแจ้งรายงานราคาพร้อมกับภาพถ่ายหน้าจอและลิงก์ URL ของเว็บไซต์สินค้านั้นๆ โดยภาพถ่ายหน้าจอต้องมีเวลาปรากฎอยู่ชัดเจน และต้องแจ้งภายใน 30 นาที หลังจากแคปหน้าจอ\n3. บริษัทฯ จะทำการตรวจสอบการแจ้งราคา และแจ้งเตือนผ่านการแจ้งเตือนในแอป และส่ง SHOPEE COINS เข้าในบัญชีของคุณอัตโนมัติ เมื่อการแจ้งราคาของคุณได้รับการตรวจสอบและยอมรับ ภายใน 14 วันทำการ หากสินค้ามีการเปลี่ยนแปลงราคาใดๆ ในระหว่าง 14 วันทำการดังกล่าว จะไม่มีผลกระทบต่อราคาที่ได้แจ้งไว้ครั้งแรก\n4. จำกัดการแจ้งราคาได้สูงสุด 1 ครั้ง/31 วัน บริษัทฯ จะไม่พิจารณาการแจ้งราคาใดๆ ที่มากกว่าจำนวนดังกล่าว\n5. บริษัทฯ ขอสงวนสิทธิ์ในการปฏิเสธคำขอแจ้งราคาจากผู้ซื้อที่มีสถานะบัญชีไม่ปกติ และขอสงวนสิทธิ์ในการไม่เปิดเผยเหตุผล กรณีที่มีการปฏิเสธการแจ้งราคา\n6. บริษัทฯ ขอสงวนสิทธิ์ในการปฏิเสธคำขอแจ้งราคาจากร้านค้าที่ทำการแจ้งสินค้าภายในร้านตนเอง\n7. ราคาที่ใช้อ้างอิงต้องเป็นราคาที่ชำระแบบปกติเท่านั้น สำหรับสินค้าราคาผ่อนชำระจะไม่ถือว่าอยู่ในเงื่อนไขของการแจ้งราคาสินค้า\n\n8. บริษัทฯ ขอสงวนสิทธิ์ในการเปลี่ยนแปลงเงื่อนไขการแจกโค้ดส่วนลด โดยไม่ต้องแจ้งให้ทราบล่วงหน้า และหากมีกรณีพิพาทเกิดขึ้นให้ยึดถือคำตัดสินของบริษัทฯ เป็นที่ยุติและสิ้นสุด\n9. บริษัทฯ ขอสงวนสิทธิ์ในการเปลี่ยนแปลง ระงับ หรือยกเลิกข้อกำหนด และ/หรือเงื่อนไขใดๆ ตามกิจกรรมนี้ได้ โดยมิต้องแจ้งให้ทราบ","label_lowest_price_guaranteed_tnc_TW":"Lowest price guaranteed terms and conditions for TW","label_lowest_price_guaranteed_tnc_VN":"THỂ LỆ CHƯƠNG TRÌNH \"GIÁ CÔNG PHÁ! Ở ĐÂU RẺ HƠN, SHOPEE HOÀN TIỀN!\"\n\nGiới thiệu\nShopee cam kết đem đến cho bạn những sản phẩm với mức giá không đâu rẻ bằng. Nếu bạn tìm thấy sản phẩm có giá thấp hơn sản phẩm bạn đã mua trên Shopee, hãy thông báo, chúng tôi sẽ hoàn trả gấp đôi phần chênh lệch (có điều kiện áp dụng).\n\nPhạm vi áp dụng\n• Thời gian: từ ngày 8.8.2017 đến 31.8.2017\n• Sản phẩm được áp dụng: thuộc chương trình “Giá công phá – Ở đâu rẻ hơn, Shopee hoàn tiền”\n• Sản phẩm để so sánh: được bán trên các trang Thương mại điện tử lớn của Việt Nam. Vui lòng liên hệ Tổng đài CSKH 19001221 để biết chi tiết\n• Giá của sản phẩm để so sánh là giá niêm yết công khai để khách hàng mua được sản phẩm mới 100%, đầy đủ, nguyên vẹn, không bao gồm phí vận chuyển hay bất kì loại phí nào; không áp dụng mã giảm giá hay bất kì hình thức giảm giá/ chiết khấu nào khác\n\nCách thông báo cho Shopee\n• Gửi email tới GiaCongPha@shopee.vn với các thông tin sau:\n- Tên tài khoản và Mã đơn hàng bạn đã mua điện thoại trên Shopee\n- Đường dẫn (link) của sản phẩm bạn muốn thông báo có giá thấp hơn\n\nĐiều kiện để được hoàn tiền\n• Bạn đã đặt mua và nhận được sản phẩm thuộc chương trình “Giá công phá – Ở đâu rẻ hơn, Shopee hoàn tiền” trên Shopee và không có khiếu nại hay yêu cầu đổi/ trả\n• Bạn thông báo cho Shopee trong 07 ngày kể từ khi nhận hàng và chưa từng thông báo về sản phẩm trên Shopee trước đó\n• Đường dẫn (link) sản phẩm trên các trang thương mại điện tử khác mà bạn thông báo vẫn còn tồn tại trong 24h kể từ thời điểm bạn gửi email đến Shopee\n• Sản phẩm mà bạn thông báo là hàng mới 100%, được phân phối chính hãng tại thị trường Việt Nam, có giá thấp hơn và hoàn toàn trùng khớp về chủ
